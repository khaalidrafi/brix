  system-ci-test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/brix-os/brix-system-ci:testing
    steps:
      - name: Verify Brix works
        run: |
          brix describe
          which wget
          which awk

      - name: Guix pull
        env:
          LC_ALL: C
        run: |
          guix describe
          guix pull --allow-downgrades --disable-authentication -M 6 -v 3 -K
          echo "DESCRIBE PULL"
          guix describe
          sudo systemctl restart guix-daemon
          
      - name: Install
        run: |
          brix install neovim


      - name: Export Current Guix Profile
        run: |
          if [ -d "$HOME/.config/guix/current" ]; then
            GUIX_PROFILE="$HOME/.config/guix/current"
            . "$GUIX_PROFILE/etc/profile"
          # else
          #   GUIX_PROFILE="/var/guix/profiles/per-user/root/current-guix"
          fi
          guix archive --export -r "$STORE_PATH"  > brix-testing-current-profile.nar

      - name: Pack pulled Guix binary
        run: |
          GUIX_PROFILE="$HOME/.config/guix/current"
          . "$GUIX_PROFILE/etc/profile"
          brix pack -s x86_64-linux --localstatedir \
            --profile-name=current-guix --root=brix-binary \
            --expression='(use-modules (gnu packages package-management)) (current-guix)'
            
      ########## CI Image ################    
      - name: Generate Docker base for CI
        run: |
          if [ -d "$HOME/.config/guix/current" ]; then
            GUIX_PROFILE="$HOME/.config/guix/current"
            . "$GUIX_PROFILE/etc/profile"
          # else
          #   GUIX_PROFILE="/var/guix/profiles/per-user/root/current-guix"
          fi
          guix pack \
          -e '(@ (gnu packages base) glibc-for-fhs)' gcc-toolchain \
          -e '(use-modules (gnu packages package-management)) (current-guix)' \
          bash-minimal coreutils-minimal net-base nss-certs \
          gawk grep git github-cli procps tar which shadow wget \
          findutils diffutils make automake autoconf tar grep sed m4 gzip xz bzip2 iproute2 inetutils libcap lndir \
          --save-provenance \
          -S /bin=bin \
          -S /share=share \
          -S /lib=lib \
          -S /usr/include=include \
          -S /sbin=sbin \
          -S /usr/libexec=libexec \
          -S /usr/share=share \
          -f docker \
          --image-tag=brix-ci-base \
          --max-layers=8 \
          --root=brix-ci

      - name: Generate Docker image
        run: |
          if [ -d "$HOME/.config/guix/current" ]; then
            GUIX_PROFILE="$HOME/.config/guix/current"
          else
            GUIX_PROFILE="/var/guix/profiles/per-user/root/current-guix"
          fi
          . "$GUIX_PROFILE/etc/profile"
          brix system image --image-type=docker --network --root=$HOME/brix-docker .github/workflows/docker-ci.scm -M 6 -v 2

          
  ci-test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/brix-os/brix-ci:testing
    steps:
      - name: Verify Brix works
        run: |
          brix describe
          which wget
          which awk

      - name: Install
        run: |
          env LANG=C.UTF-8 guix-daemon --build-users-group=guixbuild &
          brix install neovim
          
      - name: Pull
        run: |
          guix describe
          guix pull --allow-downgrades --disable-authentication -M 6 -v 3 -K

      # - name: Debug SSH on failure
      #   if: failure()
      #   uses: mxschmitt/action-tmate@v3
      #   timeout-minutes: 30
      #   with:
      #     limit-access-to-actor: true

