      # - uses: actions/upload-artifact@v7
      #   with:
      #     name: upstream-guix-binary
      #     path: guix-binary-testing.x86_64-linux.tar.xz
      #     archive: false

      - name: generate docker image
        run: |
         GUIX_PROFILE="$HOME/.config/guix/current"
         . "$GUIX_PROFILE/etc/profile"
         which guix
         guix describe
         echo "--------------Starting Docker Build-----------------------"
         guix system image --image-type=docker --network --root=guix-docker .github/workflows/docker-ci.scm -M 6 -v 2
         cp -L guix-docker guix-docker.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: upstream-guix-docker
          path: guix-docker.tar.gz
          archive: false

      - name: Debug SSH on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
        with:
          limit-access-to-actor: true
